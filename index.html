/* Layout: app de uma coluna para o celular. Topo fixo com usina e busca, lista de ativos, folha de registro por cima. */
:root{--bg:#F1F2F2;--surface:#FFFFFF;--ink:#1E2B33;--muted:#5C6870;--line:#D9DCDD;--brand:#FF8100;--brand-ink:#1B2A33;--brand-text:#B84E00;--steel:#3F5B70;--steel-ink:#FFFFFF;--warn:#B45309;--warn-bg:#FEF3C7;--ok-bg:#DDF3E6;--ok:#0A6A3F;--bad:#B3261E;--chip:#E6E9EA;
--f-body:'Barlow',system-ui,sans-serif;--f-num:'Barlow Condensed','Barlow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141C22;--surface:#1B262E;--ink:#E8EEF1;--muted:#9AAAB4;--line:#2E3D47;--brand:#FF8100;--brand-ink:#1B2A33;--brand-text:#FF9A33;--steel:#4E6B80;--steel-ink:#FFFFFF;--warn:#F5B547;--warn-bg:#3A2D0E;--ok-bg:#10301F;--ok:#6FD6A2;--bad:#FF8A80;--chip:#24323C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141C22;--surface:#1B262E;--ink:#E8EEF1;--muted:#9AAAB4;--line:#2E3D47;--brand:#FF8100;--brand-ink:#1B2A33;--brand-text:#FF9A33;--steel:#4E6B80;--steel-ink:#FFFFFF;--warn:#F5B547;--warn-bg:#3A2D0E;--ok-bg:#10301F;--ok:#6FD6A2;--bad:#FF8A80;--chip:#24323C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.35 var(--f-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
.wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
h1{font:700 22px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--steel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--ink)}}
:root[data-theme="dark"] h1{color:var(--ink)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}.logo{height:30px;width:auto;background:#fff;border-radius:8px;padding:3px 7px;display:block}
header::after{content:"";display:block;height:3px;margin-top:10px;border-radius:2px;background:linear-gradient(90deg,var(--brand),var(--steel))}
.who{font-size:13px;color:var(--muted);background:none;border:0;padding:4px 0;text-decoration:underline}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 15px var(--f-num);letter-spacing:.05em;padding:8px 13px;border-radius:99px;min-height:40px}
.chip[aria-pressed=true]{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.search{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:13px 14px;font:16px var(--f-body);min-height:48px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px;border-bottom:2px solid var(--line)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.meta{font-size:13px;color:var(--muted);margin:10px 0 6px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:64px}
.item b{font:600 16px var(--f-body);min-width:0;overflow-wrap:anywhere}
.item small{grid-column:1;color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.pill{align-self:start;font:600 12px var(--f-body);padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.pend{background:var(--chip);color:var(--muted)}.pill.nt{background:var(--warn-bg);color:var(--warn)}
.num{font-family:var(--f-num);font-weight:700;letter-spacing:.03em}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.more{width:100%;margin-top:8px;padding:12px;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:12px;font:600 14px var(--f-body)}
/* folha de registro */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .in{max-width:560px;margin:0 auto;padding:12px 0 calc(170px + env(safe-area-inset-bottom,0px))}
.back{border:0;background:none;color:var(--brand-text);font:600 16px var(--f-body);padding:10px 0;min-height:44px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.card h2{font:700 20px/1.15 var(--f-body);margin:0 0 6px;overflow-wrap:anywhere}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
label.l{display:block;font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.tag{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:700 36px var(--f-num);letter-spacing:.08em;min-height:64px}
.tag:focus{outline:none;border-color:var(--brand)}
.obs{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:16px/1.35 var(--f-body);resize:vertical}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.filtros>div{min-width:0}.filtros .l{margin-bottom:4px;font-size:12px}
select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 10px;font:15px var(--f-body);min-height:46px;text-overflow:ellipsis}
.ft{font-size:12px;font-weight:600}.ft.fo{color:var(--ok)}.ft.fn{color:var(--warn)}
.chips.st{padding-top:6px}.chip.pq{font-size:14px;min-height:36px;padding:6px 11px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:88px}
.kpi span{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.kpi b{font-size:34px;line-height:1.05}.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.bar2{height:8px;border-radius:99px;background:var(--chip);margin:12px 0 0;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--brand)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{padding:11px 5px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}.tb th:first-child{text-align:left;font:700 15px var(--f-num);letter-spacing:.05em}
.tb thead td,.tb thead th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-size:10px}.tb tbody tr,.tb tfoot tr{cursor:pointer}.tb tr.sel>*{background:var(--chip)}.tb tfoot>tr>*{border-top:1px solid var(--line);border-bottom:0}.tb tbody tr:last-child>*{border-bottom:0}
.del{width:100%;margin-top:8px;min-height:46px;border:1px solid var(--bad);background:none;color:var(--bad);border-radius:12px;font:600 15px var(--f-body)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.ntl{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:15px;min-height:44px}
.ntl input{width:22px;height:22px;accent-color:var(--brand)}
.fotos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.foto{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--chip)}
.foto img{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:48px;height:48px;border-radius:99px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px}
.lb .cnt{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px}
.foto .n{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font:700 13px var(--f-num);padding:1px 7px;border-radius:99px}
.foto .x{position:absolute;right:4px;top:4px;width:32px;height:32px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}
.foto.up{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.cam{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:2px dashed var(--brand-text);color:var(--brand-text);background:none;border-radius:12px;min-height:56px;font:600 17px var(--f-body)}
.cam input{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:25}
.bar div{max-width:560px;margin:0 auto}
.save{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font:700 18px var(--f-body)}
.save:disabled{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;max-width:90vw}
.nome{display:flex;gap:8px;margin-top:10px}
.nome input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font:16px var(--f-body)}
.nome button{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:0 16px;font:600 16px var(--f-body)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>

const USINAS=['UAE','UAT','UCP','UCR','UEL','UMV','URC','USL'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={exp:'',metaLista:null,onlyNew:true,usina:ls.get('rc_usina','UAE'),user:ls.get('rc_user',''),q:'',fs:'',fa:'',st:'',tab:'geral',fnt:'',d1:'',d2:'',lim:40,reg:{},db:null,assets:null,sel:null,erro:''};
let IDX=[],BYID=new Map();
function montar(rows){BASE=rows;IDX=rows.map(r=>({id:r[0],u:r[1],imob:r[2],sub:r[3],den:r[4],inv:r[5],loc:r[6],setor:r[7],area:r[9],tipo:r[10],foto0:!!r[11],tag:/^\d+$/.test(r[8])?r[8]:'',nt:r[8]==='NT',_s:norm([r[2],r[4],r[5],r[6],r[7],r[9]].join(' '))}));BYID=new Map(IDX.map(a=>[a.id,a]))}
/* ---- armazenamento no aparelho (IndexedDB) ---- */
let IDB=null;
function abrirIDB(){return new Promise((ok,er)=>{const q=indexedDB.open('rfid-campo',1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('meta');d.createObjectStore('registros',{keyPath:'id'})};q.onsuccess=()=>{IDB=q.result;ok()};q.onerror=()=>er(q.error)})}
const tx=(st,m='readonly')=>IDB.transaction(st,m).objectStore(st);
const rq=r=>new Promise((ok,er)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
const idbGet=(st,k)=>rq(tx(st).get(k)),idbAll=st=>rq(tx(st).getAll()),idbPut=(st,v,k)=>rq(tx(st,'readwrite').put(v,k)),idbDel=(st,k)=>rq(tx(st,'readwrite').delete(k));

const hoje=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+d.getFullYear()};
const nomeFoto=(a,tag,seq)=>`${hoje()}_${a.u}_RFID_${tag?String(tag).padStart(4,'0'):'SEMTAG-'+a.imob+'-'+a.sub}_${seq}.jpg`;
let toastT;function toast(m){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

function ef(a){const r=S.reg[a.id];const tag=r?(r.tag||''):a.tag;const nt=r?!!r.nt:a.nt;const foto=(r&&r.fotos&&r.fotos.length>0)||a.foto0;return{tag,nt:!tag&&nt,foto,conc:!!(tag&&foto)}}
const FILTROS=[['','Todos'],['sem','Sem TAG'],['tag','Com TAG'],['nt','NT'],['sf','Falta foto'],['conc','Concluído']];
const passa=(e,st)=>!st||(st==='sem'&&!e.tag)||(st==='tag'&&e.tag)||(st==='nt'&&e.nt)||(st==='sf'&&!e.foto)||(st==='conc'&&e.conc);
function resumo(us){const R={tot:0,tag:0,sem:0,nt:0,sf:0,conc:0};IDX.forEach(a=>{if(us&&a.u!==us)return;const e=ef(a);R.tot++;if(e.tag)R.tag++;else R.sem++;if(e.nt)R.nt++;if(!e.foto)R.sf++;if(e.conc)R.conc++});return R}
const pc=(n,d)=>d?Math.round(100*n/d)+'%':'0%';
function estado(a){const e=ef(a);if(e.tag)return['ok','TAG '+e.tag];if(e.nt)return['nt','NT'];return['pend','Sem TAG']}

function opcoes(){const B=IDX.filter(a=>!S.usina||a.u===S.usina);const set=[...new Set(B.map(a=>a.setor).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'pt'));const ar=[...new Set(B.filter(a=>!S.fs||a.setor===S.fs).map(a=>a.area).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'pt'));return{set,ar}}
function lista(){return IDX.filter(a=>(!S.usina||a.u===S.usina)&&passa(ef(a),S.st)&&(!S.fs||a.setor===S.fs)&&(!S.fa||a.area===S.fa)&&(!S.q||S._q.every(w=>a._s.includes(w))))}
const MOTIVOS=[['AR','Acesso Restrito','Não inventariado devido à restrição de acesso ao local.'],['NL','Não Localizado','Não encontrado durante o inventário físico.'],['VL','Venda/Leilão','Bem destinado à venda, leilão ou desmobilização.']];
const motNome=c=>{const m=MOTIVOS.find(x=>x[0]===c);return m?m[1]:''};
function dkey(ts){const d=new Date(ts||0);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function porData(R){return R.filter(r=>{const k=dkey(r.ts);if(S.d1&&k<S.d1)return false;if(S.d2&&k>S.d2)return false;const f=S.fnt;return !f||(f==='tag'&&!r.nt)||(f==='nt'&&r.nt)||(f==='sj'&&r.nt&&!r.mot)||(r.nt&&r.mot===f)})}
function filtroDataHTML(tot){const hj=dkey(Date.now()),on=(a,b)=>S.d1===a&&S.d2===b?'true':'false',off=n=>dkey(Date.now()-n*864e5);
  return `<div class="card" style="margin-top:0"><label class="l">Data de envio</label><div class="chips" role="group" aria-label="Período"><button class="chip" data-per="all" aria-pressed="${on('','')}">Tudo</button><button class="chip" data-per="0" aria-pressed="${on(hj,hj)}">Hoje</button><button class="chip" data-per="1" aria-pressed="${on(off(1),off(1))}">Ontem</button><button class="chip" data-per="7" aria-pressed="${on(off(6),hj)}">7 dias</button></div><div class="filtros"><div><label class="l" for="d1">De</label><input id="d1" type="date" value="${S.d1}" max="${S.d2||''}"></div><div><label class="l" for="d2">Até</label><input id="d2" type="date" value="${S.d2}" min="${S.d1||''}"></div></div><label class="l" style="margin-top:12px">Situação</label><div class="chips" role="group" aria-label="Situação">${[['','Todos'],['tag','Com TAG'],['nt','NT (todos)'],...MOTIVOS.map(m=>[m[0],m[1]]),['sj','NT sem justificativa']].map(([k,n])=>`<button class="chip" data-fnt="${k}" aria-pressed="${S.fnt===k}">${n}</button>`).join('')}</div>${S.d1||S.d2||S.fnt?`<div class="hint">Mostrando ${tot.n} de ${tot.t} registros com o filtro.</div>`:''}</div>`}
function render(){
  if(!IDX.length&&S.user){telaLista();return}
  if(!S.user){$('#app').innerHTML=`<header><div class="top"><div class="marca"><img class="logo" src="${LOGO}" alt="Atvos"><h1>RFID Campo</h1></div></div></header><div class="card"><label class="l" for="nm">Seu nome</label><div class="nome"><input id="nm" autocomplete="name" placeholder="Ex.: Rodrigo Pena"><button id="nmok">Entrar</button></div><p class="hint">O nome aparece em cada registro que você enviar.</p></div>`;
    const go=()=>{const v=$('#nm').value.trim();if(v.length>1){S.user=v;ls.set('rc_user',v);render()}};$('#nmok').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()};return}
  const L=lista();const feitos=Object.values(S.reg).filter(r=>!S.usina||r.usina===S.usina).length;
  let corpo='';
  if(S.tab==='geral'){corpo=geralHTML()}
  else if(S.tab==='ativos'){
    corpo=`<div class="meta">${L.length.toLocaleString('pt-BR')} ativos · ${S.usina||'todas as usinas'} · ${feitos} registrados pelo app</div><div class="list">`+
    L.slice(0,S.lim).map(a=>{const[c,t]=estado(a);return `<button class="item" data-id="${esc(a.id)}"><b>${esc(a.den||'Sem denominação')}</b><span class="pill ${c}">${esc(t)}</span><small>${S.usina?'':esc(a.u)+' · '}Imob. <span class="num">${esc(a.imob||'sem nº')}${a.imob&&a.sub!=='0'?'-'+esc(a.sub):''}</span>${a.inv?' · Inv. '+esc(a.inv):''}${a.loc?'<br>'+esc(a.loc):''}<br><span class="ft ${ef(a).foto?'fo':'fn'}">${ef(a).foto?'Foto ok':'Sem foto'}</span>${a.tipo==='C'?' · Complemento':''}</small></button>`}).join('')+`</div>`+
    (L.length>S.lim?`<button class="more" id="mais">Mostrar mais (${L.length-S.lim} restantes)</button>`:'')+(L.length?'':`<div class="empty">Nenhum ativo encontrado. Tente o número do imobilizado ou parte da descrição.</div>`);
  }else{
    const R0=Object.values(S.reg).filter(r=>!S.usina||r.usina===S.usina).sort((a,b)=>(b.ts||0)-(a.ts||0)),R=porData(R0);
    corpo=`${filtroDataHTML({n:R.length,t:R0.length})}${exportHTML(R.length)}<div class="meta">${R.length} registros enviados em ${S.usina||'todas as usinas'}${S.d1||S.d2||S.fnt?' · filtrado':''}</div><div class="list">`+R.map(r=>{const a=BYID.get(r.id);return `<button class="item" data-id="${esc(r.id)}"><b>${esc(a?a.den:r.id)}</b><span class="pill ${r.nt?'nt':'ok'}">${r.nt?'NT'+(r.mot?' · '+esc(motNome(r.mot)):''):'TAG '+esc(r.tag)}</span><small>${esc(r.id.replace(/_/g,' · '))}<br>${(r.fotos||[]).length} foto(s) · ${esc(r.por||'')}${r.obs?'<br>Obs.: '+esc(r.obs):''} · ${new Date(r.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></button>`}).join('')+`</div>`+(R.length?'':`<div class="empty">${R0.length?'Nenhum registro com este filtro.':'Nada registrado nesta usina ainda.'}</div>`);
  }
  $('#app').innerHTML=`<header><div class="top"><div class="marca"><img class="logo" src="${LOGO}" alt="Atvos"><h1>RFID Campo</h1></div><button class="who" id="troca">${esc(S.user)} · trocar</button></div>
   <div class="chips" role="group" aria-label="Usina">${['',...USINAS].map(u=>`<button class="chip" aria-pressed="${u===S.usina}" data-u="${u}">${u||'Todas'}</button>`).join('')}</div>
   ${S.tab==='ativos'?(()=>{const o=opcoes();return `<div class="filtros"><div><label class="l" for="fs">Setor / local</label><select id="fs"><option value="">Todos</option>${o.set.map(x=>`<option${x===S.fs?' selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label class="l" for="fa">Área / local</label><select id="fa"><option value="">Todas</option>${o.ar.map(x=>`<option${x===S.fa?' selected':''}>${esc(x)}</option>`).join('')}</select></div></div>`})():''}
   ${S.tab==='ativos'?`<div class="chips st" role="group" aria-label="Situação">${FILTROS.map(([k,n])=>`<button class="chip pq" aria-pressed="${k===S.st}" data-st="${k}">${n}</button>`).join('')}</div><input class="search" id="q" type="search" inputmode="search" placeholder="Buscar por nº do imobilizado, descrição ou local" value="${esc(S.q)}" autocomplete="off">`:''}
   <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="geral" aria-selected="${S.tab==='geral'}">Geral</button><button class="tab" role="tab" data-t="ativos" aria-selected="${S.tab==='ativos'}">Ativos</button><button class="tab" role="tab" data-t="env" aria-selected="${S.tab==='env'}">Enviados</button></div></header>${S.erro?`<div class="warn">${esc(S.erro)}</div>`:''}${corpo}`;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.usina=b.dataset.u;S.fs='';S.fa='';ls.set('rc_usina',S.usina);S.lim=40;render()});

async function apagar(){const s=S.sel,a=s.a;
  try{await idbDel('registros',a.id);delete S.reg[a.id];toast('Registro apagado');S.sel=null;$('#sheet').hidden=true;document.body.style.overflow='';render()}
  catch(e){s.conf=false;desenharSheet();toast('Não apagou: '+((e&&e.message)||'erro'))}}
async function salvar(){const s=S.sel,a=s.a;
  if(!s.nt&&!s.tag){toast('Informe a TAG ou marque NT');return}
  const b=$('#sv');b.disabled=true;const novas=s.fotos.filter(f=>f.local);let n=0;
  for(const f of s.fotos){if(!f.local)continue;n++;b.textContent=`Gravando foto ${n} de ${novas.length}…`;
    try{const m=await marcar(f.blob,a,{tag:s.nt?'':s.tag,nt:s.nt,user:S.user},f.ts);URL.revokeObjectURL(f.url);f.blob=m;f.url=URL.createObjectURL(m);delete f.local}
    catch(e){b.disabled=false;b.textContent=s.ex?'Salvar alterações':'Salvar registro';toast('Foto '+n+' não foi gravada: '+((e&&e.message)||'erro')+'. Toque em salvar para tentar de novo.');desenharSheet();return}}
  const doc={id:a.id,usina:a.u,imob:a.imob,sub:a.sub,inv:a.inv||'',tag:s.nt?'':s.tag,nt:s.nt,mot:s.nt?s.mot:'',fotos:s.fotos.map((f,i)=>({blob:f.blob,seq:i+1,nome:nomeFoto(a,s.tag,i+1),ts:f.ts||null})),obs:(s.obs||'').trim(),hist:(s.ex?[...(s.ex.hist||[]),{por:s.ex.por||'',ts:s.ex.ts||0,tag:s.ex.tag||'',nt:!!s.ex.nt,obs:s.ex.obs||''}]:[]).slice(-10),por:S.user,ts:Date.now(),dia:hoje(),exportadoEm:0};
  b.textContent='Salvando…';
  try{await idbPut('registros',doc);S.reg[a.id]=doc;toast('Registro salvo no aparelho');S.sel=null;$('#sheet').hidden=true;document.body.style.overflow='';render()}
  catch(e){b.disabled=false;b.textContent=s.ex?'Salvar alterações':'Salvar registro';toast('Não salvou: '+((e&&e.message)||'erro'))}}

/* ---- inicialização ---- */
(async()=>{
  render();
  try{await abrirIDB();const l=await idbGet('meta','lista');if(l&&l.rows){montar(l.rows);S.metaLista={geradoEm:l.geradoEm,n:l.n}}
    const rs=await idbAll('registros');S.reg=Object.fromEntries(rs.map(r=>[r.id,r]));
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  }catch(e){S.erro='Este navegador não permite guardar dados no aparelho. Use o Chrome.'}
  render();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body></html>
